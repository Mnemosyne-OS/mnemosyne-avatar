# The checks a contribution passes, on a clean machine: what a stranger who clones this
# repository gets. In the Mnemosyne OS monorepo this file sits in packages/avatar and does
# not run; it runs in the public Mnemosyne Avatar repository, which mirrors that folder.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Engine tests
        run: npm test
      - name: Film command line tests
        run: npm run test:film
      - name: The example builds
        run: npm run example
